<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadence icon drafts</title>
<style>
  body { font: 15px -apple-system, system-ui; margin: 0; padding: 24px; }
  .row { display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 32px; }
  figure { margin: 0; text-align: center; }
  .big img { width: 220px; border-radius: 50px; }
  .home { display: flex; gap: 24px; padding: 24px; border-radius: 16px; }
  .home img { width: 60px; border-radius: 14px; }
  .dark { background: #1c2733; } .light { background: #c9d6e3; }
</style>
<h2>Cadence icon drafts</h2>
<div class="row big">
  <figure><img src="a-in-progress.svg"><figcaption>A: Quarter in progress</figcaption></figure>
  <figure><img src="b-all-gold.svg"><figcaption>B: All gold</figcaption></figure>
  <figure><img src="c-today-on-top.svg"><figcaption>C: Today on top</figcaption></figure>
</div>
<p>At Home Screen size (60 px), on a dark and a light wallpaper:</p>
<div class="row">
  <div class="home dark"><img src="a-in-progress.svg"><img src="b-all-gold.svg"><img src="c-today-on-top.svg"></div>
  <div class="home light"><img src="a-in-progress.svg"><img src="b-all-gold.svg"><img src="c-today-on-top.svg"></div>
</div>
