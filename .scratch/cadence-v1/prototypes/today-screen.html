<!--
  PROTOTYPE, throwaway. Answers "What does opening Cadence look and feel like, and how is the rest of the app reached?"
  (.scratch/cadence-v1/issues/08-prototype-morning-screen.md)

  Round 4: the owner's mix of round 3's directions.
    - 1's big day ring and date.
    - 3's page: "My Work Main Quest is to" small, the Main Quest large, "Read the whole Quest" folds the rest out.
    - 2's labelled details: each part's name small and grey above the owner's words.
    - 3's "Write today's Reflection" link, opening 2's popup box.
  ?variant=1..6 switches the Main Quest's bold typeface: SF Pro, Geist, Plus Jakarta Sans, Manrope, Sora, Outfit.
  All but SF Pro load from Google Fonts here; the app would bundle the chosen one so it works offline.
  Round 4b (after the owner leaned to SF Pro and Manrope): more typefaces, and a border on the Reflect link.
  Rounds 1 to 3 are on branch prototype/today-screen.

  Type scale: 13 / 17 / 28 px, plus the ring's numeral. Hierarchy comes from weight and colour, not more sizes.

  ?state= pretends a date: running (Thu 12 Nov, Day 43), stale (backup overdue), before (Mon 28 Sep, before Day 1),
  late (Sun 20 Dec, last 14 days), ended (Sat 2 Jan, Q1 2027 not set up), safari (opened in a Safari tab).
  ?look=dark|light. Nothing is stored: a reload starts fresh.

  Run: python3 -m http.server 8124 --directory .scratch/cadence-v1/prototypes
  Open: http://<mac LAN ip>:8124/today-screen.html on the iPhone.
-->

}

  --sans: -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", sans-serif;

}

.pager { display: flex; align-items: flex-start; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; margin: 0 calc(-1 * var(--gutter)); scrollbar-width: none; overscroll-behavior-x: contain; }
.pager::-webkit-scrollbar { display: none; }

/* Text tabs with a gold dot (1 and 3) */
.tabs {
  position: sticky; top: 0; z-index: 12; display: flex; justify-content: center; gap: 32px;
  margin: 0 calc(-1 * var(--gutter)); padding: 10px var(--gutter) 16px;
  background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
}

}

/* The Main Quest's typeface is the variant. Only the Main Quest uses it; everything else is the system sans. */

[data-font="4"] { --title: "Manrope", -apple-system, system-ui, sans-serif; --title-w: 800; --title-ls: -0.03em; }
[data-font="5"] { --title: "Sora", -apple-system, system-ui, sans-serif; --title-w: 700; --title-ls: -0.035em; }
[data-font="6"] { --title: "Outfit", -apple-system, system-ui, sans-serif; --title-w: 700; --title-ls: -0.02em; }

/* Round 4: the Today page ---------------------------------------------------------------------- */
.top { position: relative; display: flex; flex-direction: column; align-items: center; padding: 28px 0 24px; gap: 14px; }

.readback p, .readback > div { padding: 8px 0; }

.readback li::marker { color: var(--faint); }
.hist { list-style: none; padding: 0; }
.hist-row { display: block; width: 100%; padding: 14px 0; border-bottom: 1px solid var(--line); }

.as-wrap { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; background: rgba(0, 0, 0, .5); }

.as-btn { display: block; width: 100%; min-height: 56px; text-align: center; border-bottom: 1px solid var(--line); color: var(--ink); }
.as-btn:last-child { border-bottom: 0; }
.as-btn.danger { color: var(--danger); }
.as-btn.strong { font-weight: 600; }
.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 58px); transform: translateX(-50%); z-index: 80;
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px; text-align: center;
  background: var(--ink); color: var(--void); font-weight: 500; box-shadow: 0 6px 24px rgba(0, 0, 0, .3);
}
@media (prefers-reduced-motion: no-preference) {
  .bsheet, .action-sheet { animation: up .3s var(--ease); }
  .pop { animation: pop .26s var(--ease); }
  .scrim, .as-wrap { animation: fade .2s ease-out; }
  .pushed { animation: slide .24s var(--ease); }
}
@media (prefers-reduced-motion: reduce) {
  .fold, .chev, .tab::after { transition: none; }
}
@keyframes up { from { transform: translateY(60px); opacity: 0; } }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(20px); opacity: 0; } }

/* Prototype chrome: deliberately not part of the design */
.proto { position: relative; z-index: 25; background: #fff; color: #000; font: 14px/1.4 var(--sans); padding-top: env(safe-area-inset-top); border-bottom: 2px dashed #000; }
.proto-row { display: flex; align-items: center; justify-content: center; min-height: 42px; }
.proto-arrow { width: 44px; height: 42px; font-size: 24px; color: #000; text-align: center; }
.proto-label { min-height: 42px; padding: 0 8px; color: #000; }
.proto-chip { margin-left: 6px; padding: 2px 8px; border-radius: 999px; background: #000; color: #fff; font-size: 12px; }
.proto-panel { padding: 2px 16px 14px; }

.proto-seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

.proto-k { font-weight: 600; margin-top: 12px; }

<script type="module">
import { html, render, useState, useEffect, useLayoutEffect, useRef } from 'https://cdn.jsdelivr.net/npm/htm@3/preact/standalone.module.js';

// ---------------------------------------------------------------- dates

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const diff = (a, b) => Math.round((b - a) / 864e5); // whole days from a to b
const short = d => `${d.getDate()} ${MON[d.getMonth()]}`;
const wd = d => WD[d.getDay()];
const wds = d => WD[d.getDay()].slice(0, 3);
const clock = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const same = (a, b) => diff(a, b) === 0;

const Q4 = { name: 'Q4 2026', start: D('2026-10-01'), end: D('2026-12-31'), endLong: '31 December 2026' };
const Q1 = { name: 'Q1 2027', start: D('2027-01-01'), end: D('2027-03-31') };
const TOTAL = diff(Q4.start, Q4.end) + 1; // 92
const dayOf = date => diff(Q4.start, date) + 1;

// ---------------------------------------------------------------- content

const VARIANTS = { 1: 'SF Pro', 2: 'Geist', 3: 'Plus Jakarta Sans', 4: 'Manrope', 5: 'Sora', 6: 'Outfit' }; // the Main Quest's typeface
const VKEYS = Object.keys(VARIANTS);
const STATES = {
  running: { label: 'Day 43', today: '2026-11-12', backup: '2026-11-09T20:02' },
  stale: { label: 'Backup overdue', today: '2026-11-12', backup: '2026-10-27T21:15' },
  before: { label: 'Before Day 1', today: '2026-09-28', backup: null },
  late: { label: 'Last 14 days', today: '2026-12-20', backup: '2026-12-14T19:30' },
  ended: { label: 'Quarter ended', today: '2027-01-02', backup: '2026-12-14T19:30' },
  safari: { label: 'Safari tab', today: '2026-11-12', backup: '2026-11-09T20:02', safari: true },
};
const DOMAINS = ['work', 'life']; // Work first, everywhere
const DNAME = { work: 'Work', life: 'Life' };

// The revised Prompts from "The morning ritual", Monday first.
const PROMPTS = [
  'What is the one thing that must happen this week to feel real progress on this Quest?',
  'What’s a small win from the last 24 hours that shows you’re on track?',
  'What’s the next step that would move this Quest forward?',
  'What’s getting in the way right now, and what will you do when it shows up?',
  'Looking at the week so far, are your Commitments actually moving your Success Metrics?',
  'How do you actually feel about your progress right now: energized, drained, or neutral? Why?',
  'Looking at next week, what’s one specific change you could make to your Commitments?',
];
const promptFor = d => PROMPTS[(d.getDay() + 6) % 7];

// The five parts under the Main Quest, in Scaffold order.
const PARTS = [
  { key: 'matters', name: 'Why it matters', open: 'This is the single most important thing for me to accomplish this quarter because completing it would' },
  { key: 'metrics', name: 'Success Metrics', list: true, open: `By ${Q4.endLong}, I’ll have:` },
  { key: 'exciting', name: 'Why it’s exciting', open: 'This feels really exciting and compelling for me because' },
  { key: 'obstacle', name: 'Obstacle', open: 'What’s most likely to get in my way is' },
  { key: 'commitments', name: 'Commitments', list: true, open: 'To make sure I complete the Quest, I’m going to:' },
];
const mainOpen = d => `My ${DNAME[d]} Main Quest is to`;
const endP = t => (/[.!?…”"')]$/.test(t.trim()) ? '' : '.');
const capital = t => t.charAt(0).toUpperCase() + t.slice(1);
const present = quest => PARTS.filter(p => (p.list ? quest[p.key].length : quest[p.key]));

const work1 = {
  main: 'ship the redesigned onboarding flow to every new customer by 15 November',
  matters: 'stop us losing a third of new sign-ups in their first week, which is the number the whole team is judged on',
  metrics: ['the new onboarding live for 100% of new sign-ups', 'week-one drop-off below 20%, down from 34%', 'three customer interviews written up and shared with the team'],
  exciting: 'it’s the first project I’ve led end to end, and I get to design a customer’s first ten minutes',
  obstacle: '',
  commitments: ['Two hours of deep work on onboarding every Monday and Wednesday morning', 'Book the three customer interviews by 16 October'],
};
const work2 = { ...work1, main: 'ship the redesigned onboarding flow to every new customer by 30 November' };
const work3 = { ...work2, commitments: [...work2.commitments, 'Watch five new-customer sessions every Friday afternoon'] };
const work4 = {
  ...work3, main: 'get week-one drop-off below 20% with the new onboarding',
  metrics: ['week-one drop-off below 20%, down from 34%', 'three customer interviews written up and shared with the team'],
  commitments: ['Two hours of deep work on onboarding every Monday and Wednesday morning', 'Watch five new-customer sessions every Friday afternoon', 'Ship one drop-off fix a week until the holidays'],
};
const life1 = {
  main: 'run 5K in under 25 minutes at the December parkrun',
  matters: 'prove I can keep a promise to my own body through the busiest quarter at work',
  metrics: ['run an official parkrun 5K in under 25:00', 'logged at least 36 runs since 1 October', 'slept 7 hours on most weeknights, by my watch'],
  exciting: 'I’ve never thought of myself as a runner, and a fast finish would make me one',
  obstacle: '',
  commitments: ['Run every Tuesday, Thursday and Saturday at 6:30am', 'Sign up for the 13 December parkrun by 15 October', 'Phone out of the bedroom by 10:30pm on weeknights'],
};
const life2 = { ...life1, obstacle: 'late client calls that eat my evenings; when one does, I run at 6:30 the next morning' };

const freshRefl = () => ({ work: { text: '', at: null }, life: { text: '', at: null } });

function freshState(u = new URLSearchParams(location.search)) {
  const state = STATES[u.get('state')] ? u.get('state') : 'running';
  const view = freshView();
  if (['archive', 'backup', 'history'].includes(u.get('open'))) view.stack.push({ s: u.get('open'), d: 'work' });

}

// Everything the screens need to know about "now".
function where(st) {
  const today = D(STATES[st.state].today);
  const safari = !!STATES[st.state].safari;
  let phase;
  if (today < Q4.start) phase = { k: 'before', until: diff(today, Q4.start) };
  else if (today > Q4.end) phase = { k: 'ended' };
  else { const day = dayOf(today); phase = { k: 'running', day, left: TOTAL - day, late: diff(today, Q4.end) < 14 }; }
  const backupAt = st.backup ? new Date(st.backup) : null;
  const backupAge = backupAt ? diff(new Date(backupAt.getFullYear(), backupAt.getMonth(), backupAt.getDate()), today) : null;
  return {
    today, safari, phase,
    canReflect: phase.k === 'running',
    canEdit: phase.k !== 'ended',
    prompt: phase.k === 'running' ? promptFor(today) : null,
    backupAt, backupAge,
    backupDue: backupAge === null || backupAge >= 7 || phase.k === 'ended',
    quest: d => versionsAt(d, today)[0].quest,
  };
}
const backupText = w => {
  if (!w.backupAt) return 'No backup yet';
  if (w.backupAge === 0) return `Today, ${clock(w.backupAt)}`;
  if (w.backupAge === 1) return `Yesterday, ${clock(w.backupAt)}`;
  return `${w.backupAge} days ago`;
};
const dayLine = w => (w.phase.k === 'running' ? `Day ${w.phase.day} of ${TOTAL}`
  : w.phase.k === 'before' ? `Starts ${wd(Q4.start)} ${short(Q4.start)}` : `Ended ${wd(Q4.end)} ${short(Q4.end)}`);
const dateLine = w => (w.phase.k === 'running' ? `${wd(w.today)} ${short(w.today)}` : dayLine(w));
const noReflecting = w => (w.phase.k === 'before' ? `Reflections start on Day 1, ${wd(Q4.start)} ${short(Q4.start)}.`
  : w.phase.k === 'ended' ? 'Reflecting starts again once Q1 2027 is set up.' : '');

// ---------------------------------------------------------------- keyboard

// iOS only raises the keyboard for focus() inside a tap handler. Parking focus on a hidden input during the tap
// keeps the keyboard up while the popup renders; the popup's field then takes focus.
const holdKeyboard = () => document.getElementById('kb-proxy').focus({ preventScroll: true });
const isEditable = el => el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.isContentEditable);
function useViewport() {
  useEffect(() => {
    const vv = window.visualViewport;
    if (!vv) return;
    const root = document.documentElement;
    const f = () => {
      const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      root.style.setProperty('--kb', kb + 'px');
      root.style.setProperty('--vvh', Math.round(vv.height) + 'px');
      root.style.setProperty('--vvt', Math.round(vv.offsetTop) + 'px');
      root.classList.toggle('kb-open', kb > 60);
    };
    vv.addEventListener('resize', f); vv.addEventListener('scroll', f); f();
    return () => { vv.removeEventListener('resize', f); vv.removeEventListener('scroll', f); };
  }, []);
}

// ---------------------------------------------------------------- shared pieces

// One tick per Day of the Quarter, longer at each month's start; today's tick is gold.
function Ring({ w, size, numeral = true }) {
  const r = size / 2;
  const passed = w.phase.k === 'before' ? 0 : w.phase.k === 'ended' ? TOTAL : w.phase.day;
  const isToday = i => w.phase.k === 'running' && i === passed - 1;
  const sw = Math.max(1, size / 120);
  const ticks = Array.from({ length: TOTAL }, (_, i) => {
    const date = new Date(Q4.start); date.setDate(date.getDate() + i);
    const len = size * (isToday(i) ? 0.13 : date.getDate() === 1 ? 0.085 : 0.05);
    const a = (i / TOTAL) * 2 * Math.PI - Math.PI / 2;
    const r1 = r - 1, r2 = r1 - len;
    const col = isToday(i) ? 'var(--gold)' : i < passed ? 'var(--gold-dim)' : 'var(--line)';
    return html`<line x1=${r + r1 * Math.cos(a)} y1=${r + r1 * Math.sin(a)} x2=${r + r2 * Math.cos(a)} y2=${r + r2 * Math.sin(a)}
      stroke=${col} stroke-width=${isToday(i) ? sw * 1.8 : sw} stroke-linecap="round" />`;
  });
  const big = w.phase.k === 'before' ? w.phase.until : w.phase.k === 'ended' ? TOTAL : w.phase.day;
  const small = w.phase.k === 'before' ? (w.phase.until === 1 ? 'day to go' : 'days to go') : w.phase.k === 'ended' ? 'ended' : `of ${TOTAL}`;
  return html`<div class="ring" style=${`width:${size}px;height:${size}px`} role="img" aria-label=${dayLine(w)}>
    <svg width=${size} height=${size} viewBox=${`0 0 ${size} ${size}`}>${ticks}</svg>
    <div class="ring-mid">
      <span class="ring-big" style=${`font-size:${numeral ? Math.round(size * 0.29) : 17}px`}>${big}</span>
      ${numeral && html`<span class="ring-small">${small}</span>`}
    </div>
  </div>`;
}

// Swipeable pages, one per Quest. The tab follows a swipe once it passes halfway.
function usePager(ctx) {
  const { st, upd } = ctx;
  const ref = useRef();
  const heading = useRef(null); // the page a tapped tab is scrolling to
  const page = Math.min(st.view.page, DOMAINS.length - 1);
  const setPage = i => upd(s => { s.view.page = i; return s; });
  const goPage = i => { const el = ref.current; heading.current = i; if (el) el.scrollTo({ left: i * el.clientWidth, behavior: 'smooth' }); setPage(i); };
  useLayoutEffect(() => { const el = ref.current; if (el) el.scrollLeft = page * el.clientWidth; }, []);
  const onScroll = e => {
    const el = e.currentTarget; const i = Math.round(el.scrollLeft / el.clientWidth);
    if (heading.current !== null) { if (i === heading.current) heading.current = null; return; }
    if (i !== page) setPage(i);
  };
  return { ref, page, goPage, onScroll };
}
function TextTabs({ pager }) {
  return html`<nav class="tabs" role="tablist">${DOMAINS.map((d, i) => html`<button type="button" role="tab" aria-selected=${i === pager.page}
    class=${'tab' + (i === pager.page ? ' on' : '')} onClick=${() => pager.goPage(i)}>${DNAME[d]}</button>`)}</nav>`;
}

// The writing part of every popup: a draft that only reaches the Reflection on Save.
function useDraft(ctx, d) {
  const saved = ctx.st.refl[d].text;
  const [text, setText] = useState(saved);
  const changed = text.trim() !== saved;
  const save = () => {
    const t = text.trim();
    ctx.upd(s => { s.refl[d] = { text: t, at: t ? new Date().toISOString() : null }; return s; });
    ctx.write(null);
    if (!t && saved) ctx.say(`${DNAME[d]} Reflection removed`);
  };
  return { text, setText, changed, save, saved, label: !text.trim() && saved ? 'Remove' : 'Save' };
}
function Field({ draft, ph, grow = true }) {
  const ref = useRef();
  useLayoutEffect(() => { ref.current.focus({ preventScroll: true }); const n = ref.current.value.length; ref.current.setSelectionRange(n, n); }, []);
  useLayoutEffect(() => { if (!grow) return; const el = ref.current; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }, [draft.text]);
  return html`<textarea ref=${ref} class="field" rows="4" value=${draft.text} placeholder=${ph} aria-label="Reflection"
    autocapitalize="sentences" onInput=${e => draft.setText(e.target.value)} />`;
}
const midnight = 'You can change it until midnight.';
const useLock = () => useEffect(() => { document.documentElement.classList.add('lock'); return () => document.documentElement.classList.remove('lock'); }, []);

// 2's popup box: the Prompt, a field, Cancel and Save, centred over a blurred scrim.
function Popup({ ctx, d }) {
  const draft = useDraft(ctx, d);

    <div class="pop-wrap" onClick=${e => { if (e.target === e.currentTarget) ctx.write(null); }}>
      <div class="pop" role="dialog" aria-label=${`${DNAME[d]} Reflection`}>
        <p class="s faint">${DNAME[d]}, ${wds(ctx.w.today)} ${short(ctx.w.today)}</p>

          <button type="button" class="ghost" onClick=${() => ctx.write(null)}>Cancel</button>
          <button type="button" class="primary" disabled=${!draft.changed} onClick=${draft.save}>${draft.label}</button>
        </div>
      </div>
    </div>`;
}

function HistoryList({ ctx, d }) {

    <button type="button" class="hist-row" onClick=${() => ctx.go({ s: 'version', d, i })}>

function reflectionsFor(ctx) {
  const { st, w } = ctx;
  const all = SAMPLE_REFLECTIONS.filter(r => r.date < w.today);
  DOMAINS.forEach(d => { if (st.refl[d].text) all.push({ date: w.today, d, text: st.refl[d].text, prompt: w.prompt }); });
  const days = [];
  all.sort((a, b) => b.date - a.date || DOMAINS.indexOf(a.d) - DOMAINS.indexOf(b.d)).forEach(r => {
    const last = days[days.length - 1];
    if (last && same(last.date, r.date)) last.items.push(r); else days.push({ date: r.date, prompt: r.prompt, items: [r] });
  });
  return days;
}

      <${NavHead} left="Cancel" onLeft=${ctx.back} title="Set up Q1 2027" />
      <p class="given" style="margin-top:20px">Q1 2027 · ${short(Q1.start)} – ${short(Q1.end)}</p>
      <p class="proto-note">Stand-in. Setup runs as in Prototype: writing a Quest, from a blank Scaffold: Work first, then Life, then “Q1 2027 is set up”.</p>
      <button type="button" class="primary" style="margin-top:16px" onClick=${() => {
        ctx.back();
        if (w.phase.k === 'ended') ctx.say('Cadence would now open on Q1 2027, Day 2 of 90');
        else { ctx.upd(s => { s.q1Set = true; return s; }); ctx.say('Q1 2027 is set up'); }
      }}>Pretend both Quests are finished</button>
    </div>`;
  }
  if (scr.s === 'version') {
    const v = versionsAt(scr.d, w.today)[scr.i];
    return html`<div class="pushed">
      <${NavHead} left="‹ History" onLeft=${ctx.back} title=${versionLabel(v)} sub=${scr.i === 0 ? 'Current' : 'Read-only'} />
      <div style="margin-top:12px"><${ReadBack} quest=${v.quest} d=${scr.d} /></div>
    </div>`;
  }
  const title = scr.s === 'history' ? `${DNAME[scr.d]} History` : scr.s === 'archive' ? 'Archive' : 'Backup';
  return html`<div class="pushed">
    <${NavHead} left="‹ Today" onLeft=${ctx.back} title="" />
    <h1 class="h1">${title}</h1>
    ${scr.s === 'history' && html`<p class="given">How this Quest changed across Q4 2026, newest first.</p><${HistoryList} ctx=${ctx} d=${scr.d} />`}
    ${scr.s === 'archive' && html`<${ArchiveFeed} ctx=${ctx} />`}
    ${scr.s === 'backup' && html`<${BackupPanel} ctx=${ctx} />`}
  </div>`;
}

// ---------------------------------------------------------------- shell

function Sheet({ c, close }) {
  return html`<div class="as-wrap" onClick=${close}>
    <div class="action-sheet" role="dialog" aria-label=${c.title} onClick=${e => e.stopPropagation()}>
      <div class="as-group">
        ${c.title && html`<p class="as-title">${c.title}</p>`}
        ${c.body && html`<div class="as-body">${c.body}</div>`}
        ${c.actions.map(a => html`<button type="button" class=${'as-btn' + (a.danger ? ' danger' : '') + (a.strong ? ' strong' : '')}
          onClick=${() => { close(); if (a.run) a.run(); }}>${a.label}</button>`)}
      </div>
      <div class="as-group"><button type="button" class="as-btn strong" onClick=${close}>${c.cancel || 'Cancel'}</button></div>
    </div>
  </div>`;
}

function ProtoStrip({ st, upd, cycle }) {
  const [panel, setPanel] = useState(false);
  return html`<div class="proto">
    <div class="proto-row">
      <button type="button" class="proto-arrow" aria-label="Previous variant" onClick=${() => cycle(-1)}>‹</button>
      <button type="button" class="proto-label" aria-expanded=${panel} onClick=${() => setPanel(!panel)}>
        <b>${st.variant}</b> ${VARIANTS[st.variant]}<span class="proto-chip">${STATES[st.state].label}</span></button>
      <button type="button" class="proto-arrow" aria-label="Next variant" onClick=${() => cycle(1)}>›</button>
    </div>
    ${panel && html`<div class="proto-panel">
      <p class="proto-k">Pretend it’s…</p>
      <div class="proto-seg">${Object.entries(STATES).map(([k, v]) => html`<button type="button" aria-pressed=${st.state === k}
        onClick=${() => { upd(s => withState(s, k)); window.scrollTo(0, 0); }}>${v.label}</button>`)}</div>
      <p class="proto-k">Look</p>
      <div class="proto-seg">${['dark', 'light'].map(k => html`<button type="button" aria-pressed=${st.look === k}
        onClick=${() => upd(s => { s.look = k; return s; })}>${k === 'dark' ? 'Dark' : 'Light'}</button>`)}</div>
      <p>Round 4: 1’s ring, 3’s page and Reflect link, 2’s labelled details and popup. The arrows switch the Main Quest’s typeface. Day 43 and Backup overdue are Thu 12 Nov. Before Day 1 is Mon 28 Sep. Last 14 days is Sun 20 Dec. Quarter ended is Sat 2 Jan, with Q1 2027 not set up. Changing the date resets anything you wrote.</p>
    </div>`}
  </div>`;
}

function App() {
  const [st, setSt] = useState(freshState);
  const upd = fn => setSt(s => fn(structuredClone(s)));
  const [toast, say] = useState(null);
  const [asking, ask] = useState(null);
  useViewport();
  const w = where(st);
  const go = scr => { document.activeElement?.blur?.(); upd(s => { s.view.stack.push(scr); return s; }); window.scrollTo(0, 0); };
  const back = () => { upd(s => { s.view.stack.pop(); return s; }); window.scrollTo(0, 0); };
  const write = d => { if (!d) document.activeElement?.blur?.(); upd(s => { s.writing = d; return s; }); };
  const ctx = { st, w, upd, say, ask, go, back, write };
  useEffect(() => {
    document.documentElement.dataset.look = st.look;
    document.documentElement.dataset.font = st.variant;
    document.querySelector('meta[name=theme-color]').content = st.look === 'light' ? '#F4F5F7' : '#0F1113';
  }, [st.look, st.variant]);
  useEffect(() => {
    const u = new URL(location.href);
    u.searchParams.set('variant', st.variant); u.searchParams.set('state', st.state); u.searchParams.set('look', st.look);
    u.searchParams.delete('open'); u.searchParams.delete('page');
    history.replaceState(null, '', u);
  }, [st.variant, st.state, st.look]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => say(null), 2600); return () => clearTimeout(t); }, [toast]);
  const cycle = dir => { document.activeElement?.blur?.(); upd(s => { const k = VKEYS.indexOf(s.variant); s.variant = VKEYS[(k + dir + VKEYS.length) % VKEYS.length]; s.writing = null; return s; }); window.scrollTo(0, 0); };
  useEffect(() => {
    const f = e => {
      if (isEditable(document.activeElement)) return;
      if (e.key === 'ArrowRight') cycle(1);
      if (e.key === 'ArrowLeft') cycle(-1);
    };
    addEventListener('keydown', f);
    return () => removeEventListener('keydown', f);
  }, []);
  const top = st.view.stack[st.view.stack.length - 1];
  return html`
    <${ProtoStrip} st=${st} upd=${upd} cycle=${cycle} />
    ${top
      ? html`<main class="app"><${Pushed} ctx=${ctx} scr=${top} key=${st.view.stack.length} /></main>`
      : html`<${Today} ctx=${ctx} key=${st.state} />`}
    ${toast && html`<div class="toast" role="status">${toast}</div>`}
    ${asking && html`<${Sheet} c=${asking} close=${() => ask(null)} />`}`;
}

render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
