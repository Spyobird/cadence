<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F5F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1113" />
    <meta name="apple-mobile-web-app-title" content="Cadence" />
    <meta name="description" content="Two Quests a Quarter, and a place to reflect on them" />
    <!-- No apple-mobile-web-app-status-bar-style: the status bar is a solid strip in the page's colour (spec §2.4) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <title>Cadence</title>
    <script>
      // The Appearance chosen in the menu, before first paint (spec §2.8). This reads the copy of meta.appearance
      // that src/lib/appearance.ts keeps: Light or Dark fixes the look and the status bar; System leaves both to the phone.
      try {
        var look = localStorage.getItem('cadence:appearance')
        if (look === 'light' || look === 'dark') {
          var voids = { light: '#F4F5F7', dark: '#0F1113' }
          document.documentElement.dataset.look = look
          document.querySelector('meta[name="color-scheme"]').content = look
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = voids[look]
          })
        }
      } catch (error) {
        // Storage blocked: the first paint follows the phone
      }
    </script>
    <style>
      /* First paint, before the stylesheet loads: --void, matching theme-color */
      html, body { background-color: #F4F5F7; }
      @media (prefers-color-scheme: dark) { html, body { background-color: #0F1113; } }
      :root[data-look='light'], :root[data-look='light'] body { background-color: #F4F5F7; }
      :root[data-look='dark'], :root[data-look='dark'] body { background-color: #0F1113; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
